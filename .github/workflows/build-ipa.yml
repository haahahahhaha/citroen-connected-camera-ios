name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Select Xcode 26.6
        run: |
          sudo xcode-select -s /Applications/Xcode_26.6.app
          xcodebuild -version

      - name: Install Mint
        run: brew install mint

      - name: Bootstrap project
        run: ./scripts/bootstrap.sh

         - name: Build unsigned app
        run: |
          xcodebuild \
            -project CitroenConnectedCamera.xcodeproj \
            -scheme Development \
            -configuration Development \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build \
            CONFIGURATION_BUILD_DIR="$PWD/build/App"
      - name: Create IPA
        run: |
          mkdir -p build/Payload
          cp -R build/App/CitroenConnectedCamera.app build/Payload/
          cd build
          zip -r CitroenConnectedCamera-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: CitroenConnectedCamera-unsigned
          path: build/CitroenConnectedCamera-unsigned.ipa
